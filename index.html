<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英文單字系統 Pro 6</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#222;--muted:#666;--line:#ddd;--dark:#111;--soft:#f0f0f0;--good:#07803f;--bad:#c00}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);margin:0;color:var(--text)}header{text-align:center;padding:28px 20px 10px}h1{margin:0;font-size:30px}p{color:var(--muted)}main{max-width:1080px;margin:auto;padding:15px}.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 20px rgba(0,0,0,.05)}textarea,input,button,select{font:inherit}textarea,input,select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff}textarea{min-height:150px}button{padding:10px 14px;border:none;border-radius:12px;cursor:pointer;background:var(--dark);color:#fff;margin-top:10px}.secondary{background:#e5e7eb;color:#111}.danger,.delete-btn{background:#fee2e2;color:#991b1b}.good-btn{background:#dcfce7;color:#166534}.warn-btn{background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.word{padding:14px;border:1px solid #eee;border-radius:14px;margin-top:10px;background:#fff}.word strong{font-size:20px}.small{font-size:13px;color:var(--muted)}.quiz{font-size:28px;font-weight:700;margin:18px 0}.option{display:block;width:100%;text-align:left;margin-top:8px;background:#fff;color:#111;border:1px solid #ddd}.correct{color:var(--good);font-weight:700}.wrong{color:var(--bad);font-weight:700}.tag{display:inline-block;padding:4px 10px;background:var(--soft);border-radius:999px;font-size:13px;margin:4px 4px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{margin-top:0}.group-title{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8f8f8;border-radius:14px;margin-top:14px;cursor:pointer;font-weight:700}.group-content{display:none}.group-content.show{display:block}.word-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.delete-btn{padding:8px 10px;font-size:13px}details summary{cursor:pointer;font-size:20px;font-weight:700}.flashcard{min-height:280px;border:2px solid #eee;border-radius:24px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;cursor:pointer}.flash-word{font-size:46px;font-weight:800;margin:10px 0}.flash-meaning{font-size:28px;font-weight:700;margin:10px 0}.flash-sentence{font-size:20px;line-height:1.7;margin-top:12px}.progress{height:10px;background:#eee;border-radius:999px;overflow:hidden}.progress-inner{height:100%;background:#111;width:0}nav{position:sticky;top:0;background:rgba(245,245,243,.92);backdrop-filter:blur(8px);z-index:10;padding:10px 15px;border-bottom:1px solid #eee}.nav-inner{max-width:1080px;margin:auto;display:flex;gap:8px;overflow:auto}.nav-inner button{white-space:nowrap;margin:0;background:#fff;color:#111;border:1px solid #ddd}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:24px}.flash-word{font-size:36px}.flash-meaning{font-size:24px}}
</style>
</head>
<body>
<header><h1>高中英文單字系統 Pro 6</h1><p>閃卡｜發音｜熟悉度｜英翻中｜中翻英｜克漏字｜拼字｜分類｜考卷</p></header>
<nav><div class="nav-inner"><button onclick="jump('importSec')">匯入</button><button onclick="jump('flashSec')">閃卡</button><button onclick="jump('choiceSec')">選擇題</button><button onclick="jump('clozeSec')">克漏字</button><button onclick="jump('spellSec')">拼字</button><button onclick="jump('bankSec')">單字庫</button><button onclick="jump('paperSec')">考卷</button><button onclick="jump('wrongSec')">錯題</button></div></nav>
<main>
<section class="card" id="importSec"><h2>批次匯入</h2><div class="grid"><div><label class="small">小標題 / 單元</label><input id="importGroup" placeholder="例如：U20"></div><div><label class="small">匯入後</label><select id="afterImport"><option value="clear">清空匯入框</option><option value="keep">保留內容</option></select></div></div><p class="small">格式：單字｜詞性｜中文｜例句。支援 ｜、|、tab、Excel 貼上。</p><textarea id="bulk"></textarea><div class="toolbar"><button onclick="importWords()">匯入</button><button class="secondary" onclick="loadDemo()">示範</button><button class="danger" onclick="clearWords()">清空全部單字庫</button></div><div id="importResult"></div></section>
<section class="card"><h2>複習範圍</h2><div class="grid"><div><label class="small">選擇單元</label><select id="groupFilter" onchange="refreshAll()"></select></div><div><label class="small">搜尋</label><input id="search" placeholder="搜尋英文、中文、詞性或例句" oninput="renderWords()"></div></div><p class="small">下面所有練習都會依照這裡選的單元出題。</p></section>
<section class="card" id="flashSec"><h2>閃卡模式</h2><div class="progress"><div id="flashProgress" class="progress-inner"></div></div><p class="small" id="flashInfo"></p><div class="flashcard" onclick="flipCard()"><div id="flashFront"><div class="small">點卡片翻面</div><div class="flash-word" id="flashWord">尚無單字</div><div><span class="tag" id="flashPos"></span></div></div><div id="flashBack" style="display:none"><div class="flash-meaning" id="flashMeaning"></div><div class="flash-sentence" id="flashSentence"></div></div></div><div class="toolbar" style="margin-top:12px"><button onclick="event.stopPropagation();speakCurrent()">🔊 發音</button><button class="danger" onclick="event.stopPropagation();rateCurrent('hard')">😵 不熟</button><button class="warn-btn" onclick="event.stopPropagation();rateCurrent('normal')">😐 普通</button><button class="good-btn" onclick="event.stopPropagation();rateCurrent('easy')">😎 熟</button><button class="secondary" onclick="event.stopPropagation();nextFlash()">下一張</button></div></section>
<section class="card" id="choiceSec"><h2>選擇題</h2><div class="grid"><div><label class="small">題目方向</label><select id="choiceMode" onchange="newChoice()"><option value="en-to-zh">看英文，選中文</option><option value="zh-to-en">看中文，選英文</option><option value="sentence-to-word">看例句，選單字（克漏字選擇題）</option></select></div><div><label class="small">選項數量</label><select id="choiceCount" onchange="newChoice()"><option value="4">4 個選項</option><option value="3">3 個選項</option></select></div></div><div id="choiceBox"></div><button onclick="newChoice()">下一題</button></section>
<section class="card" id="clozeSec"><h2>克漏字填空</h2><div id="clozeBox"></div><button onclick="newCloze()">下一題</button></section>
<section class="card" id="spellSec"><h2>拼字測驗</h2><p class="small">看中文解釋，輸入英文單字。</p><div id="spellBox"></div><button onclick="newSpell()">下一題</button></section>
<section class="card" id="bankSec"><details open><summary>單字庫 <span id="count" class="tag"></span></summary><div id="wordList"></div></details></section>
<section class="card" id="paperSec"><h2>考卷</h2><p class="small">會依照目前選擇的複習範圍產生考卷。</p><div class="grid"><div><label class="small">題數</label><select id="paperCount"><option value="10">10題</option><option value="20">20題</option><option value="30">30題</option><option value="999">全部</option></select></div><div><label class="small">類型</label><select id="paperType"><option value="spell">中翻英</option><option value="cloze">克漏字</option><option value="mixed">混合</option></select></div></div><div class="toolbar"><button onclick="makePaper()">產生考卷</button><button class="secondary" onclick="downloadPaper()">下載 TXT</button><button class="secondary" onclick="printPaper()">列印 / 存成 PDF</button></div><textarea id="paper" placeholder="考卷會出現在這裡"></textarea></section>
<section class="card" id="wrongSec"><h2>錯題本</h2><div id="wrongBox"></div><button onclick="clearWrong()">清空錯題</button></section>
</main>
<script>
const WORD_KEY="words_pro6", WRONG_KEY="wrongs_pro6";
let words=JSON.parse(localStorage.getItem(WORD_KEY)||localStorage.getItem("words_pro5")||localStorage.getItem("words_pro4")||localStorage.getItem("words_pro3")||localStorage.getItem("words_pro2")||localStorage.getItem("words_pro")||"[]");
let wrongs=JSON.parse(localStorage.getItem(WRONG_KEY)||localStorage.getItem("wrongs_pro5")||localStorage.getItem("wrongs_pro3")||localStorage.getItem("wrongs_pro2")||localStorage.getItem("wrongs_pro")||"[]");
let flashDeck=[],flashIndex=0,flashFlipped=false;
words=words.map(w=>({id:w.id||Date.now()+Math.random(),group:w.group||"未分類",word:w.word||"",pos:w.pos||"",meaning:w.meaning||"",sentence:w.sentence||"",level:w.level||"normal",reviewCount:w.reviewCount||0,wrongCount:w.wrongCount||0}));
save(false);refreshAll();
function jump(id){document.getElementById(id).scrollIntoView({behavior:"smooth",block:"start"})}
function save(render=true){localStorage.setItem(WORD_KEY,JSON.stringify(words));localStorage.setItem(WRONG_KEY,JSON.stringify(wrongs));if(render){renderGroups();renderWords();renderWrongs();}}
function normalizeLine(line){line=line.trim();if(!line)return null;line=line.replace(/\t/g,"｜").replace(/\|/g,"｜");let p=line.split("｜").map(x=>x.trim());if(p.length<2)return null;return{word:p[0]||"",pos:p[1]||"",meaning:p[2]||"",sentence:p.slice(3).join("｜")||""}}
function importWords(){let group=(document.getElementById("importGroup").value||"未分類").trim()||"未分類",text=document.getElementById("bulk").value,count=0,skipped=0;text.split(/\r?\n/).forEach(line=>{let obj=normalizeLine(line);if(obj&&obj.word){obj.group=group;obj.id=Date.now()+Math.random();obj.level="normal";obj.reviewCount=0;obj.wrongCount=0;words.push(obj);count++}else if(line.trim())skipped++});save();document.getElementById("importResult").innerHTML=`<p class="correct">成功匯入 ${count} 筆到「${escapeHtml(group)}」；略過 ${skipped} 行。</p>`;if(document.getElementById("afterImport").value==="clear")document.getElementById("bulk").value="";renderGroups();document.getElementById("groupFilter").value=group;refreshAll();}
function clearWords(){if(confirm("確定清空全部單字？")){words=[];["words_pro","words_pro2","words_pro3","words_pro4","words_pro5","words_pro6"].forEach(k=>localStorage.removeItem(k));save();refreshAll();}}
function deleteWord(id){if(confirm("刪除這個單字？")){words=words.filter(w=>String(w.id)!==String(id));save();refreshAll();}}
function renderGroups(){let sel=document.getElementById("groupFilter"),cur=sel.value||"全部",groups=[...new Set(words.map(w=>w.group||"未分類"))].sort();sel.innerHTML='<option value="全部">全部</option>'+groups.map(g=>`<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join("");sel.value=(groups.includes(cur)||cur==="全部")?cur:"全部";}
function getCurrentGroup(){return document.getElementById("groupFilter")?.value||"全部"}function getActiveWords(){let g=getCurrentGroup();return g==="全部"?words:words.filter(w=>w.group===g)}
function renderWords(){let box=document.getElementById("wordList"),q=(document.getElementById("search")?.value||"").toLowerCase(),list=getActiveWords().filter(w=>[w.word,w.meaning,w.pos,w.sentence,w.group,w.level].join(" ").toLowerCase().includes(q));document.getElementById("count").textContent=list.length+" / "+words.length+" 筆";if(!list.length){box.innerHTML="<p class='small'>沒有單字。</p>";return}let groups={};list.forEach(w=>{if(!groups[w.group])groups[w.group]=[];groups[w.group].push(w)});box.innerHTML=Object.entries(groups).map(([group,items],i)=>`<div class="group-title" onclick="toggleGroup('g${i}')"><div>${escapeHtml(group)} <span class="tag">${items.length}筆</span></div><div>▼</div></div><div class="group-content show" id="g${i}">${items.map(w=>`<div class="word"><div class="word-top"><div><strong>${escapeHtml(w.word)}</strong><span class="tag">${escapeHtml(w.pos)}</span><span class="tag">${levelText(w.level)}</span><div>${escapeHtml(w.meaning)}</div><div class="small">${escapeHtml(w.sentence)}</div><div class="small">複習 ${w.reviewCount||0} 次｜錯 ${w.wrongCount||0} 次</div></div><div><button class="secondary" onclick="event.stopPropagation();speakWord('${escapeJs(w.word)}')">🔊</button><button class="delete-btn" onclick="event.stopPropagation();deleteWord('${escapeJs(w.id)}')">刪除</button></div></div></div>`).join("")}</div>`).join("");}
function toggleGroup(id){document.getElementById(id).classList.toggle("show")}function refreshAll(){renderGroups();renderWords();renderWrongs();resetFlashDeck();newChoice();newCloze();newSpell();}
function randomItem(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function resetFlashDeck(){let a=getActiveWords(),hard=a.filter(w=>w.level==="hard"),normal=a.filter(w=>w.level==="normal"),easy=a.filter(w=>w.level==="easy");flashDeck=shuffle([...hard,...hard,...normal,...easy]);flashIndex=0;flashFlipped=false;renderFlash();}
function currentFlash(){return flashDeck[flashIndex]}function renderFlash(){let w=currentFlash();if(!w){document.getElementById("flashWord").textContent="目前範圍沒有單字";document.getElementById("flashPos").textContent="";document.getElementById("flashMeaning").textContent="";document.getElementById("flashSentence").textContent="";document.getElementById("flashInfo").textContent="";document.getElementById("flashProgress").style.width="0%";return}document.getElementById("flashFront").style.display=flashFlipped?"none":"block";document.getElementById("flashBack").style.display=flashFlipped?"block":"none";document.getElementById("flashWord").textContent=w.word;document.getElementById("flashPos").textContent=w.pos||"";document.getElementById("flashMeaning").textContent=(w.pos?w.pos+" ":"")+(w.meaning||"");document.getElementById("flashSentence").textContent=w.sentence||"";document.getElementById("flashInfo").textContent=`${w.group||"未分類"}｜${flashIndex+1}/${flashDeck.length}｜${levelText(w.level)}`;document.getElementById("flashProgress").style.width=((flashIndex+1)/flashDeck.length*100)+"%";}
function flipCard(){flashFlipped=!flashFlipped;renderFlash()}function nextFlash(){if(!flashDeck.length)return;flashIndex=(flashIndex+1)%flashDeck.length;flashFlipped=false;renderFlash()}function speakCurrent(){let w=currentFlash();if(w)speakWord(w.word)}
function speakWord(word){if(!("speechSynthesis" in window)){alert("這個瀏覽器不支援發音");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function rateCurrent(level){let w=currentFlash();if(!w)return;let real=words.find(x=>String(x.id)===String(w.id));if(real){real.level=level;real.reviewCount=(real.reviewCount||0)+1;if(level==="hard")real.wrongCount=(real.wrongCount||0)+1}save();nextFlash()}function levelText(level){return level==="hard"?"😵 不熟":level==="easy"?"😎 熟":"😐 普通"}
function newChoice(){let box=document.getElementById("choiceBox"),list=getActiveWords(),need=parseInt(document.getElementById("choiceCount")?.value||"4",10);if(list.length<need){box.innerHTML=`<p>目前範圍單字數不足，至少需要 ${need} 個單字。</p>`;return}let mode=document.getElementById("choiceMode")?.value||"en-to-zh",answer=randomItem(list),pool=shuffle(list.filter(w=>w.word!==answer.word)).slice(0,need-1),options=shuffle([answer,...pool]),question="",optionText=o=>"",correct="";if(mode==="en-to-zh"){question=answer.word;optionText=o=>o.meaning;correct=answer.meaning}else if(mode==="zh-to-en"){question=answer.meaning;optionText=o=>o.word;correct=answer.word}else{let usable=list.filter(w=>w.sentence&&w.word);if(usable.length<need){box.innerHTML="<p>目前範圍有例句的單字不足。</p>";return}answer=randomItem(usable);pool=shuffle(usable.filter(w=>w.word!==answer.word)).slice(0,need-1);options=shuffle([answer,...pool]);question=answer.sentence.replace(new RegExp(answer.word,"ig"),"______");optionText=o=>o.word;correct=answer.word}box.innerHTML=`<div class="quiz">${escapeHtml(question)}</div><div class="small">${escapeHtml(answer.group||"未分類")}　${mode==="sentence-to-word"?escapeHtml(answer.meaning||""):escapeHtml(answer.pos||"")}</div>${options.map(o=>`<button class="option" onclick="checkAnswer('${escapeJs(correct)}','${escapeJs(optionText(o))}','${escapeJs(answer.word)}','choiceResult')">${escapeHtml(optionText(o))}</button>`).join("")}<div id="choiceResult"></div>`;}
function checkAnswer(correct,chosen,word,resultId){let box=document.getElementById(resultId);if(correct===chosen)box.innerHTML="<p class='correct'>答對了！</p>";else{box.innerHTML="<p class='wrong'>答錯！答案："+escapeHtml(correct)+"</p>";wrongs.push({word,meaning:correct,group:getCurrentGroup(),time:new Date().toLocaleString()});let real=words.find(w=>w.word===word);if(real){real.wrongCount=(real.wrongCount||0)+1;real.level="hard"}save();}}
function newCloze(){let box=document.getElementById("clozeBox"),usable=getActiveWords().filter(w=>w.sentence&&w.word&&w.sentence.toLowerCase().includes(w.word.toLowerCase()));if(!usable.length){box.innerHTML="<p>目前範圍沒有可用例句。</p>";return}let q=randomItem(usable),sentence=q.sentence.replace(new RegExp(q.word,"ig"),"______");box.innerHTML=`<div style="font-size:22px;line-height:1.8">${escapeHtml(sentence)}</div><p>${escapeHtml(q.meaning||"")} <span class="tag">${escapeHtml(q.group||"未分類")}</span></p><input id="clozeInput" placeholder="輸入英文單字"><button onclick="checkInput('${escapeJs(q.word)}','${escapeJs(q.meaning)}','clozeInput','clozeResult')">送出</button><div id="clozeResult"></div>`;}
function newSpell(){let box=document.getElementById("spellBox"),list=getActiveWords();if(!list.length){box.innerHTML="<p>目前範圍沒有單字。</p>";return}let q=randomItem(list);box.innerHTML=`<div class="quiz">${escapeHtml(q.meaning||"")}</div><div class="small">${escapeHtml(q.pos||"")} <span class="tag">${escapeHtml(q.group||"未分類")}</span></div><input id="spellInput" placeholder="輸入英文單字"><button onclick="checkInput('${escapeJs(q.word)}','${escapeJs(q.meaning)}','spellInput','spellResult')">送出</button><div id="spellResult"></div>`;}
function checkInput(answer,meaning,inputId,resultId){let val=document.getElementById(inputId).value.trim(),box=document.getElementById(resultId);if(val.toLowerCase()===answer.toLowerCase())box.innerHTML="<p class='correct'>答對了！</p>";else{box.innerHTML="<p class='wrong'>答錯！答案："+escapeHtml(answer)+"</p>";wrongs.push({word:answer,meaning,group:getCurrentGroup(),time:new Date().toLocaleString()});let real=words.find(w=>w.word===answer);if(real){real.wrongCount=(real.wrongCount||0)+1;real.level="hard"}save();}}
function makePaper(){let type=document.getElementById("paperType").value,count=parseInt(document.getElementById("paperCount").value),list=shuffle(getActiveWords());if(count!==999)list=list.slice(0,count);let out=["英文單字測驗","範圍："+getCurrentGroup(),"姓名：__________　日期：__________",""];list.forEach((w,i)=>{if(type==="spell")out.push((i+1)+". "+(w.meaning||"")+"：____________________");else if(type==="cloze"){let s=w.sentence&&w.word?w.sentence.replace(new RegExp(w.word,"ig"),"________"):"________  "+(w.meaning||"");out.push((i+1)+". "+s+"　（"+(w.meaning||"")+"）")}else{if(i%2===0)out.push((i+1)+". "+(w.meaning||"")+"：____________________");else{let s=w.sentence&&w.word?w.sentence.replace(new RegExp(w.word,"ig"),"________"):"________  "+(w.meaning||"");out.push((i+1)+". "+s+"　（"+(w.meaning||"")+"）")}}});out.push("","答案：");list.forEach((w,i)=>out.push((i+1)+". "+w.word));document.getElementById("paper").value=out.join("\n");}
function downloadPaper(){let text=document.getElementById("paper").value;if(!text){alert("請先產生考卷");return}let blob=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="英文考卷.txt";a.click();}
function printPaper(){let text=document.getElementById("paper").value;if(!text){alert("請先產生考卷");return}let win=window.open("","","width=800,height=900");win.document.write("<pre style='font-size:18px;line-height:1.8;font-family:-apple-system,BlinkMacSystemFont,Noto Sans TC,sans-serif;white-space:pre-wrap;'>"+escapeHtml(text)+"</pre>");win.document.close();win.print();}
function renderWrongs(){let box=document.getElementById("wrongBox");if(!wrongs.length){box.innerHTML="<p class='small'>目前沒有錯題。</p>";return}box.innerHTML=wrongs.slice().reverse().map(w=>`<div class="word"><span class="tag">${escapeHtml(w.group||"")}</span><br><strong>${escapeHtml(w.word)}</strong><div>${escapeHtml(w.meaning)}</div><div class="small">${escapeHtml(w.time)}</div></div>`).join("");}
function clearWrong(){wrongs=[];["wrongs_pro","wrongs_pro2","wrongs_pro3","wrongs_pro5","wrongs_pro6"].forEach(k=>localStorage.removeItem(k));save();}
function loadDemo(){document.getElementById("importGroup").value="U20";document.getElementById("bulk").value=`cube｜n./vt.｜立方體；切成小方塊｜The mouse ate three cubes of cheese today.
cubic｜adj.｜立方體的；立方的｜We measure space in cubic meters.
murmur｜n./vi./vt.｜低語聲；低聲說；私下抱怨｜John said "I like you" in a low murmur.
biography｜n.｜傳記｜Dr. Wilson authorized Nick to write his biography.`;}
function escapeHtml(str){return String(str||"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}function escapeAttr(str){return escapeHtml(str).replace(/`/g,"&#96;")}function escapeJs(str){return String(str||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ")}
</script>
</body>
</html>
